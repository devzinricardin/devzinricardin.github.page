<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>Previsao do Tempo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <style>
  body {
    background: linear-gradient(
    rgb(20,120,250),
    
    rgb(250,120,20)
    );
    min-height: 100vh;
  }
  
  #container {
    margin-top: 150px;
    text-align:center;
    justify-content: center;
    vertical-align: center;
    align: center;
    background-color: rgba(255,255,255,0.5);
    border-radius: 10px;
  }
  #formulario {
    text-align:center;
    background-color: rgb(255,255,255);
    border-radius: 10px;
  }
  
  #infos {
    background-color: rgb(50,150,255);
    border-radius: 10px;
    height: 50px;
    vertical-align: center;
  }
  </style>
</head>
<body>
  
  
  <div id="container">
    <form id="formulario">
      <i class="bi bi-clouds-fill"></i>
      <input id="input-search">
      <button id="botao-search"><i class="bi bi-search"></i></button>
    </form>
    
    <h1>Previsao do Tempo</h1>
    
    <div id="infos">
      <h2 id="temp">0.0 <sup>°C</sup></h2>
    </div>
  </div>
  
  <script>
  document.querySelector("#formulario").addEventListener("submit",async (event) => {
    event.preventDefault();
    
    let cityName = document.querySelector("#input-search").value;
    
    if (!cityName) {
      alert("Cidade não digitada");
      
      return;
    }
    
    let Api_key = '1e24f1332f847e8695b55d68dc101d0a';
    
    let url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(cityName)}&appid=${Api_key}&units=metric`;
    
    let response = await fetch(url);
    
    let data = await response.json();
    
    if (!data) {
      alert("Cidade invalida!");
      
      return;
    }
    
    document.querySelector("#temp").innerHTML = `${data.main.temp}<sup>°C</sup>`;
  });
  </script>
</body>
</html>
